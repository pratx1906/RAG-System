server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Increase body size limit for file uploads (must match UPLOAD_MAX_MB + buffer)
    client_max_body_size 25M;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1000;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Proxy all backend API paths to the backend service
    location ~ ^/(auth|upload|query|projects|health|docs|openapi\.json) {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        client_max_body_size 25M;
    }

    # Serve React SPA — all other paths go to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
